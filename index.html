<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portal ANED</title>

  <style>

    /* =====================================================
       CONFIGURACIÓN GENERAL
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      overflow: hidden;
    }


    /* =====================================================
       ENCABEZADO
       ===================================================== */

    .header {

      height: 90px;

      background: #E85D3F;

      color: white;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 15px;

    }

    .header h1 {

      font-size: 25px;

      font-weight: 700;

    }


    /* =====================================================
       NAVEGACIÓN
       ===================================================== */

    .navigation {

      height: 65px;

      background: white;

      display: flex;

      justify-content: center;

      align-items: center;

      border-bottom: 1px solid #ddd;

      box-shadow:
        0 1px 4px rgba(0,0,0,0.10);

      overflow-x: auto;

    }


    .tab {

      height: 100%;

      padding: 0 30px;

      border: none;

      background: white;

      font-size: 15px;

      font-weight: bold;

      color: #555;

      cursor: pointer;

      border-bottom: 4px solid transparent;

      white-space: nowrap;

      transition: all 0.2s ease;

    }


    .tab:hover {

      background: #fff5f2;

      color: #E85D3F;

    }


    .tab.active {

      color: #E85D3F;

      border-bottom: 4px solid #E85D3F;

      background: #fff7f5;

    }


    /* =====================================================
       SELECTOR PARA CELULAR
       ===================================================== */

    .mobile-select {

      display: none;

      width: 100%;

      padding: 10px;

      font-size: 14px;

      border: 1px solid #ccc;

      border-radius: 6px;

      background: white;

    }


    /* =====================================================
       VISOR
       ===================================================== */

    .viewer {

      width: 100%;

      height: calc(100vh - 155px);

      background: white;

    }


    #dashboard {

      width: 100%;

      height: 100%;

      border: none;

      display: block;

    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 768px) {

      body {
        overflow: auto;
      }


      .header {

        height: 80px;

      }


      .header h1 {

        font-size: 20px;

      }


      .navigation {

        height: 65px;

        padding: 8px 12px;

      }


      .tab {

        display: none;

      }


      .mobile-select {

        display: block;

      }


      .viewer {

        height: calc(100vh - 145px);

        min-height: 500px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       ENCABEZADO
       ===================================================== -->

  <header class="header">

    <h1>
      Portal ANED
    </h1>

  </header>


  <!-- =====================================================
       NAVEGACIÓN
       ===================================================== -->

  <nav class="navigation">


    <!-- ===================================================
         MÓDULO 1
         =================================================== -->

    <button
      class="tab active"
      onclick="cargarDashboard(0)"
    >

      ANED_ Taller de Liderazgo Docente

    </button>


    <!-- ===================================================
         MÓDULO 2
         =================================================== -->

    <button
      class="tab"
      onclick="cargarDashboard(1)"
    >

      ANED_ Manejo Seguro de Alimentos

    </button>


    <!-- ===================================================
         MÓDULO 3
         =================================================== -->

    <button
      class="tab"
      onclick="cargarDashboard(2)"
    >

      Ale_ Actividades de Mantenimiento

    </button>


    <!-- ===================================================
         SELECTOR MÓVIL
         =================================================== -->

    <select
      id="mobileSelect"
      class="mobile-select"
      onchange="cargarDashboard(this.value)"
    >

      <option value="0">
        ANED_ Taller de Liderazgo Docente
      </option>

      <option value="1">
        ANED_ Manejo Seguro de Alimentos
      </option>

      <option value="2">
        Ale_ Actividades de Mantenimiento
      </option>

    </select>

  </nav>


  <!-- =====================================================
       VISOR DE DASHBOARDS
       ===================================================== -->

  <main class="viewer">

    <iframe
      id="dashboard"
      src="https://oswaldoayala13.github.io/ANED_Taller_Liderazgo_Docente/"
      title="Portal ANED"
    ></iframe>

  </main>


  <!-- =====================================================
       JAVASCRIPT
       ===================================================== -->

  <script>

    /* =====================================================
       URL DE LOS DASHBOARDS
       ===================================================== */

    const dashboards = [

      /* 0 - Taller de Liderazgo Docente */

      "https://oswaldoayala13.github.io/ANED_Taller_Liderazgo_Docente/",


      /* 1 - Manejo Seguro de Alimentos */

      "https://oswaldoayala13.github.io/ANED_Manejo-de-Seguro-de-alimentos/",


      /* 2 - Actividades de Mantenimiento */

      "https://oswaldoayala13.github.io/ANED_ALE-ACTIVIDADES-DE-MANTENIMIENTO/"

    ];


    /* =====================================================
       ELEMENTOS
       ===================================================== */

    const iframe =
      document.getElementById("dashboard");


    const tabs =
      document.querySelectorAll(".tab");


    const mobileSelect =
      document.getElementById("mobileSelect");


    /* =====================================================
       FUNCIÓN PARA CARGAR DASHBOARD
       ===================================================== */

    function cargarDashboard(indice) {

      indice = Number(indice);


      /* Validación */

      if (
        indice < 0 ||
        indice >= dashboards.length
      ) {

        indice = 0;

      }


      /* Cargar dashboard */

      iframe.src =
        dashboards[indice];


      /* Actualizar pestaña activa */

      tabs.forEach(
        function(tab, i) {

          if (i === indice) {

            tab.classList.add("active");

          } else {

            tab.classList.remove("active");

          }

        }
      );


      /* Actualizar selector móvil */

      mobileSelect.value =
        indice;

    }


  </script>


</body>

</html>
